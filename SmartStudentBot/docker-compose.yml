# این فایل docker-compose تمام سرویس‌ها را مدیریت می‌کند
# version حذف شده چون دیگر لازم نیست (Docker Compose v2+)

services:
  # سرویس اصلی بات
  app:
    build: .
    container_name: smartstudentbot-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app                    # برای توسعه زنده
    command: python main.py       # در لوکال polling

  # MongoDB
  mongo:
    image: mongo:6-jammy
    container_name: smartstudentbot-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: smartstudentbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  redis_data: